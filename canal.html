<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Info Río y Clima</title>
<style>
:root{--bg:#061826;--bg2:#0b3250;--card:#0e2d47;--line:#1f5a85;--tx:#eef5f6;--mut:#93b6cc;--ac:#5fd0e0;--ok:#3ddc97;--al:#ffb43a;--ev:#ff5a5f}
*{box-sizing:border-box;margin:0}
html{font-size:min(1.25vw,2.2vh)}
body{height:100vh;overflow:hidden;background:linear-gradient(160deg,var(--bg2),var(--bg) 62%);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",Roboto,sans-serif}
#app{position:relative;z-index:1;height:100vh;padding:3.5vh 4vw;display:flex;flex-direction:column;gap:1.6vh}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:1.5rem}
header b{font-size:1.5rem;letter-spacing:.02em}
#clock{font-size:1.8rem;font-variant-numeric:tabular-nums}
.badge{font-size:1rem;padding:.25rem .8rem;border-radius:2rem;background:var(--al);color:#251800;font-weight:700}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:1.6rem}
h1{font-size:2.4rem;font-weight:700;text-shadow:0 .1rem .6rem #000}
.slide{display:flex;flex-direction:column;gap:1.6rem;animation:in .7s ease}
@keyframes in{from{opacity:0}}
.grid{display:grid;gap:1.4rem;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.card{background:rgba(9,36,58,.92);border-left:.45rem solid var(--ok);padding:1.2rem 1.4rem;display:flex;flex-direction:column;gap:.5rem;border-radius:.4rem}
.card.alerta{border-color:var(--al)}.card.evac{border-color:var(--ev)}
.top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;font-size:1.35rem}
.chip{font-size:1rem;padding:.15rem .7rem;border-radius:2rem;background:var(--ok);color:#03281a;font-weight:700;white-space:nowrap}
.chip.alerta{background:var(--al);color:#251800}.chip.evac{background:var(--ev);color:#2b0002}
.val{font-size:4.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.val small,.kpi small{font-size:1.6rem;font-weight:400;color:var(--mut)}
.tr{font-size:1.3rem}.lim,.meta{font-size:1.05rem;color:var(--mut)}
.old{color:var(--al);font-weight:700}
.bar{position:relative;height:.6rem;background:#08202f;border-radius:1rem;margin-top:.3rem}
.bar i{display:block;height:100%;border-radius:1rem;background:var(--ok)}
.alerta .bar i{background:var(--al)}.evac .bar i{background:var(--ev)}
.bar u{position:absolute;top:-.3rem;width:.18rem;height:1.2rem;background:var(--tx)}
.sp{width:100%;height:2.6rem}.sp polyline{stroke:var(--ac);stroke-width:2}
.banner{padding:1.2rem 1.6rem;font-size:1.9rem;border-left:.45rem solid var(--ok);background:rgba(9,36,58,.92);border-radius:.4rem}
.banner.al{border-color:var(--al)}.banner.ev{border-color:var(--ev)}
.banner small{display:block;font-size:1.2rem;color:var(--mut);margin-top:.4rem}
.kpi{font-size:3.6rem;font-weight:700}.kpi div{font-size:1.3rem;font-weight:400;color:var(--mut)}
.now{display:flex;align-items:center;gap:2rem}.now .big{font-size:7rem}
.rows{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;font-size:1.2rem;align-items:baseline}
.rows b{font-size:1.6rem}.rows span{color:var(--mut);font-size:1rem}
footer{font-size:1rem;color:var(--mut);white-space:nowrap}
#prog{height:.35rem;background:#08202f;border-radius:1rem;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--ac)}
#dots span{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;background:#1b4766;margin-right:.5rem}
#dots .on{background:var(--ac)}
#map{position:fixed;inset:0;z-index:0;perspective:1500px;perspective-origin:50% 34%;overflow:hidden}
#tilt{position:absolute;left:50%;top:34%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(52deg)}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform-origin:0 0;transition:transform 4.5s cubic-bezier(.45,0,.2,1);will-change:transform}
.mk{position:absolute;width:0;height:0;transform-style:preserve-3d;opacity:0;transition:opacity 1s}
.mk.act{opacity:1}
.pin{position:absolute;left:0;top:0;transform-style:preserve-3d;transform-origin:0 0;transform:translateZ(18px) rotateX(-52deg) scale(var(--inv,1));transition:transform 4.5s cubic-bezier(.45,0,.2,1)}
.pin .dot{position:absolute;left:-.6rem;top:-.6rem;width:1.2rem;height:1.2rem;border-radius:50%;background:var(--c,var(--ac));border:.17rem solid #fff}
.pin .ring{position:absolute;left:-1.5rem;top:-1.5rem;width:3rem;height:3rem;border-radius:50%;border:.2rem solid var(--c,var(--ac));animation:pul 2.2s ease-out infinite}
.pin b{position:absolute;left:1.1rem;top:-1.6rem;white-space:nowrap;font-size:1.4rem;text-shadow:0 .1rem .5rem #000,0 0 .2rem #000}
@keyframes pul{from{transform:scale(.4);opacity:1}to{transform:scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}
</style>
</head>
<body>
<div id="map"><div id="tilt"><div id="world"></div></div></div>
<div id="app">
  <header><b>🌊 Reporte Fluvial: Info Río y Clima</b><span id="flags"></span><span id="clock"></span></header>
  <div id="stage"></div>
  <div id="prog"><i></i></div>
  <footer>
    <span id="dots"></span>
    <span>Fuentes: AGPSE, SHN, INA, CARU, PNA y Open-Meteo. Datos orientativos. Emergencias: Prefectura 106.</span>
    <span id="hint">◀ ▶ cambiar · OK pausa · ▲ voz</span>
  </footer>
</div>
<script>
const DATA_URL = (window.location && window.location.pathname && window.location.pathname.includes('/hidrometros/')) ? './data.json' : 'https://andresehansen.github.io/hidrometros/data.json';
const MIN_MS=12000,MAX_MS=60000,LAT=-34.8339,LON=-57.8803;
const T={subiendo:'⬆️',bajando:'⬇️',estacionado:'➡️'};
const mk=(a,h,f,fu,al,ev,e,d,old)=>({altura:a,horaStr:h,fechaStr:f,fuente:fu,alerta:al,evacuacion:ev,antiguo:!!old,tendencia:{icono:T[e],estado:e,texto:e[0].toUpperCase()+e.slice(1)+' ('+d+'m)'}});
// Datos de ejemplo (solo si no se puede leer data.json). Sin pronóstico INA.
const DEMO={fechaReporte:'18/11/2026 a las 10:19 hs',
 laplata:mk('1.57','09:45','18/11/2026','SHN',2.5,2.8,'subiendo','+0.02'),
 sanfernando:mk('1.34','09:45','18/11/2026','SHN',2.8,3.2,'subiendo','+0.15'),
 martingarcia:mk('1.39','09:45','18/11/2026','SHN',2.3,2.6,'subiendo','+0.02',1),
 iguazu:mk('19.88','09:00','18/11/2026','INA',25,28,'subiendo','+0.03'),
 sanjavier:mk('2.75','00:00','17/11/2026','PNA',8,10,'bajando','-1.25',1),
 santotome:mk('6.64','00:00','17/11/2026','PNA',11.5,12.5,'bajando','-0.64',1),
 concordia:mk('7.74','06:00','18/11/2026','SRH',11,12.5,'bajando','-0.24'),
 saltogrande:{arriba:mk('35.11','00:00','18/11/2026','CARU',35.5,36,'estacionado','0.00'),abajo:mk('10.98','00:00','18/11/2026','CARU',17.3,17.8,'bajando','-0.32')},
 viento:{velocidad:11.9,direccion:'Suroeste (SW)',temperatura:24.1},
 pronostico:{pleamar:{hora:'10:30',altura:'1.50',fecha:'18/11'},bajamar:{hora:'17:00',altura:'1.00',fecha:'18/11'}},
 pronosticoSudestada:{nivelAlerta:'verde',titulo:'🟢 Sin previsión de sudestada para las próximas 24 hs',mensaje:'Pleamar máxima prevista: 1.50m (18/11 a las 10:30 hs). Condiciones habituales de marea.'}};

const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const lim=s=>(s||'').replace(/\s*\(.*?\)/g,'').replace(/\bhs\b/g,'horas').replace(/[^\p{L}\p{N}\s.,:;%°\-]/gu,'').replace(/\s+/g,' ').trim();
const dir8=d=>['norte','noreste','este','sudeste','sur','sudoeste','oeste','noroeste'][Math.round(d/45)%8];
const fl=iso=>new Date(iso+'T12:00').toLocaleDateString('es-AR',{day:'numeric',month:'long'});
const WMO=c=>c===0?['☀️','despejado']:c<=2?['🌤️','parcialmente nublado']:c===3?['☁️','nublado']:c<=48?['🌫️','con niebla']:c<=57?['🌦️','con llovizna']:c<=67?['🌧️','con lluvia']:c<=77?['❄️','con nevadas']:c<=82?['🌧️','con chubascos']:c<=86?['❄️','con nevadas']:['⛈️','con tormentas'];

let D=null,W=null,W2=null,demo=false,wAt=0,S=[],i=0,tok=0,paused=false,mute=false,blocked=false,voice=null;

function estado(e){const a=+e.altura;
 if(e.evacuacion&&a>=e.evacuacion)return['evac','Evacuación','de evacuación'];
 if(e.alerta&&a>=e.alerta)return['alerta','Alerta','de alerta'];
 return['ok','Normal','normal']}
function spark(h){if(!h||h.length<3)return'';const v=h.slice(-48).map(x=>+x.altura),lo=Math.min(...v),r=(Math.max(...v)-lo)||1;
 return`<svg class="sp" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline fill="none" vector-effect="non-scaling-stroke" points="${v.map((y,k)=>(k/(v.length-1)*100).toFixed(1)+','+(28-(y-lo)/r*26).toFixed(1)).join(' ')}"/></svg>`}
function card(n,e){const[c,tx]=estado(e),a=+e.altura,m=e.evacuacion||e.alerta||a*1.2,p=Math.max(2,Math.min(100,a/m*100));
 return`<div class="card ${c}"><div class="top"><b>${n}</b><span class="chip ${c}">${tx}</span></div>
 <div class="val">${fmt(a)}<small> m</small></div><div class="tr">${e.tendencia?.icono||''} ${e.tendencia?.texto||''}</div>
 <div class="bar"><i style="width:${p}%"></i>${e.alerta?`<u style="left:${Math.min(99,e.alerta/m*100)}%"></u>`:''}</div>
 <div class="lim">Alerta ${e.alerta??'—'} m, evacuación ${e.evacuacion??'—'} m</div>${spark(e.historico)}
 <div class="meta">${e.fuente||''}, ${e.horaStr||''} del ${e.fechaStr||''}${e.antiguo?' <span class="old">dato con retraso</span>':''}</div></div>`}
const vozE=(n,e)=>`${n.replace('·',',')}: ${fmt(e.altura)} metros, ${e.tendencia?.estado||'sin tendencia'}. Nivel ${estado(e)[2]}.${e.antiguo?' Dato con retraso.':''}`;

function armar(){
 const all=[],grp=(t,l,intro,cam)=>{const c=l.filter(x=>x[1]);all.push(...c);
  return{t,cam,m:c.map(x=>x[2]),h:`<div class="grid" style="--n:${c.length}">${c.map(x=>card(...x)).join('')}</div>`,v:intro+' '+c.map(x=>vozE(...x)).join(' ')}};
 const g1=grp('🌊 Río de la Plata',[['La Plata',D.laplata,'laplata'],['San Fernando',D.sanfernando,'sanfernando'],['Martín García',D.martingarcia,'martingarcia']],'Río de la Plata.',[-58.2,-34.55,4.6]);
 const g2=grp('🏞️ Río Uruguay',[['Salto Grande, embalse',D.saltogrande?.arriba,'saltogrande'],['Salto Grande, restitución',D.saltogrande?.abajo,'saltogrande'],['Concordia',D.concordia,'concordia'],['Santo Tomé',D.santotome,'santotome']],'Río Uruguay.',[-57.2,-30.0,2.4]);
 const g3=grp('💧 Iguazú y Paraná',[['Puerto Iguazú',D.iguazu,'iguazu'],['San Javier',D.sanjavier,'sanjavier']],'Ríos Iguazú y Paraná.',[-57.3,-28.2,1.8]);
 const bad=all.filter(x=>estado(x[1])[0]!=='ok'),L=[];
 // portada
 const sd=D.pronosticoSudestada,lp=D.laplata,c=W?.current;
 const tem=c?Math.round(c.temperature_2m):Math.round(D.viento?.temperatura),vel=c?Math.round(c.wind_speed_10m):Math.round(D.viento?.velocidad);
 const dw=c?dir8(c.wind_direction_10m):lim(D.viento?.direccion).toLowerCase();
 const hr=(D.fechaReporte||'').match(/\d{1,2}:\d{2}/)?.[0]||'';
 const viejo=!demo&&D.generadoEn&&(Date.now()-Date.parse(D.generadoEn))/36e5>3;
 const sc=!sd?'':sd.nivelAlerta==='verde'?'':sd.nivelAlerta==='rojo'?'ev':'al';
 L.push({t:'Reporte del día',cam:[-64,-38.5,.72],m:['laplata','concordia','iguazu'],h:`<div class="banner ${sc}">${D.fechaReporte||''}${sd?`<br>${sd.titulo}<small>${sd.mensaje}</small>`:''}</div>
  <div class="grid" style="--n:3"><div class="kpi">${fmt(lp.altura)}<small> m</small><div>Río de la Plata en La Plata, ${lp.tendencia?.estado||''}</div></div>
  <div class="kpi">${tem}<small> °C</small><div>Temperatura</div></div><div class="kpi">${vel}<small> km/h</small><div>Viento del ${dw}</div></div></div>`,
  v:`Reporte fluvial, actualizado a las ${hr} horas. ${viejo?'Atención: los datos tienen más de tres horas de antigüedad. ':''}${sd?lim(sd.titulo)+'. ':''}En La Plata el río marca ${fmt(lp.altura)} metros y está ${lp.tendencia?.estado}. Temperatura de ${tem} grados, viento del ${dw} a ${vel} kilómetros por hora.`});
 if(bad.length)L.push({t:'🚨 Atención: niveles de alerta',cam:[-64,-38.5,.72],m:bad.map(x=>x[2]),h:`<div class="grid" style="--n:${Math.min(bad.length,4)}">${bad.slice(0,4).map(x=>card(...x)).join('')}</div>`,v:'Atención. '+bad.map(x=>vozE(...x)).join(' ')});
 L.push(g1);
 // mareas
 const P=D.pronostico;if(P?.pleamar||sd){const m=(n,x)=>x?`<div class="card"><div class="top"><b>${n}</b></div><div class="val">${x.hora}<small> h</small></div><div class="tr">Altura prevista ${fmt(x.altura)} m</div><div class="meta">${x.fecha||''}</div></div>`:'';
  L.push({t:'🌙 Pronóstico de mareas en La Plata',cam:[-57.9,-34.8,4.6],m:['laplata'],h:`<div class="grid" style="--n:2">${m('Pleamar',P?.pleamar)}${m('Bajamar',P?.bajamar)}</div>${sd?`<div class="banner ${sc}">${sd.titulo}<small>${sd.mensaje}</small></div>`:''}`,
  v:`Pronóstico de mareas para La Plata. ${P?.pleamar?`Pleamar a las ${P.pleamar.hora}, con ${fmt(P.pleamar.altura)} metros. `:''}${P?.bajamar?`Bajamar a las ${P.bajamar.hora}, con ${fmt(P.bajamar.altura)} metros. `:''}${sd?lim(sd.titulo)+'.':''}`})}
 // clima
 const cl=(nom,w,cam,mk)=>{if(!w)return;const c=w.current,d=w.daily,[ic,ds]=WMO(c.weather_code),t=Math.round(c.temperature_2m),v=Math.round(c.wind_speed_10m),dd=dir8(c.wind_direction_10m),
  nm=k=>k===0?'Hoy':k===1?'Mañana':new Date(d.time[k]+'T12:00').toLocaleDateString('es-AR',{weekday:'long'}),vm=k=>Math.round(d.wind_speed_10m_max?.[k]);
  L.push({t:'⛅ Clima en '+nom,cam,m:[mk],h:`<div class="now"><div class="big">${ic}</div><div><div class="val">${t}<small> °C</small></div><div class="tr">${ds}, sensación ${Math.round(c.apparent_temperature)}°, humedad ${c.relative_humidity_2m}%, viento del ${dd} a ${v} km/h</div></div></div>
  <div class="grid" style="--n:${d.time.length}">${d.time.map((f,k)=>`<div class="card"><div class="top"><b>${nm(k)}</b><span>${WMO(d.weather_code[k])[0]}</span></div><div class="val">${Math.round(d.temperature_2m_max[k])}°<small> / ${Math.round(d.temperature_2m_min[k])}°</small></div><div class="meta">Lluvia ${d.precipitation_probability_max[k]??'—'}%, viento hasta ${vm(k)} km/h</div></div>`).join('')}</div>`,
  v:`Clima en ${nom}. Ahora ${t} grados, ${ds}, viento del ${dd} a ${v} kilómetros por hora. `+d.time.map((f,k)=>`${nm(k)}: máxima de ${Math.round(d.temperature_2m_max[k])}, mínima de ${Math.round(d.temperature_2m_min[k])}, probabilidad de lluvia ${d.precipitation_probability_max[k]??0} por ciento, viento de hasta ${vm(k)} kilómetros por hora.`).join(' ')})};
 cl('La Plata',W,[-57.9,-34.8,2.3],'laplata');cl('Villa Paranacito',W2,[-58.65,-33.72,3.2],'paranacito');
 L.push(g2,g3);
 // INA
 const I=D.pronosticosINA?.estaciones;if(I){const es=Object.values(I).filter(x=>x.proyecciones?.length);
  L.push({t:'📈 Pronóstico del INA',cam:[-58.8,-29.5,1.7],m:['iguazu','corrientes','parana','rosario'],h:`<div class="grid" style="--n:${es.length}">${es.map(x=>`<div class="card"><div class="top"><b>${x.nombre}</b><span class="chip">${x.tendencia}</span></div><div class="meta">${x.cuenca}</div><div class="rows">${x.proyecciones.map(p=>`<b>${fmt(p.esperado)} m</b><span>${p.fechaIso.slice(8)}/${p.fechaIso.slice(5,7)}, entre ${fmt(p.min)} y ${fmt(p.max)}</span>`).join('')}</div></div>`).join('')}</div>`,
  v:'Pronóstico del Instituto Nacional del Agua. '+es.map(x=>{const a=x.proyecciones[0],z=x.proyecciones.at(-1);return`${x.nombre}, ${x.tendencia}: se espera ${fmt(a.esperado)} metros el ${fl(a.fechaIso)} y ${fmt(z.esperado)} metros el ${fl(z.fechaIso)}.`}).join(' ')})}
 return L}

function pickVoice(){const v=speechSynthesis.getVoices();voice=['es-AR','es-US','es-MX','es-ES'].map(l=>v.find(x=>x.lang.replace('_','-')===l)).find(Boolean)||v.find(x=>x.lang.startsWith('es'))||null}

function say(txt){return new Promise(res=>{
 if(mute||blocked||!('speechSynthesis' in window)){res();return}
 const u=new SpeechSynthesisUtterance(txt);u.lang=voice?.lang||'es-AR';if(voice)u.voice=voice;u.rate=.95;
 u.onend=res;u.onerror=e=>{if(e.error==='not-allowed'){blocked=true;flags()}res()};

function flags(){$('#flags').innerHTML=(demo?'<span class="badge">Datos de ejemplo</span> ':'')+(blocked?'<span class="badge">🔇 Presioná OK para activar la voz</span> ':'')+(mute?'<span class="badge">Voz silenciada</span> ':'')+(paused?'<span class="badge">⏸ Pausa</span>':'')}

function show(){const s=S[i];setMap(s);$('#stage').innerHTML=`<div class="slide"><h1>${s.t}</h1>${s.h}</div>`;

 await Promise.all([new Promise(r=>setTimeout(r,MIN_MS)),say(S[i].v)]);
 if(t===tok&&!paused)go(1)}

 if(i>=S.length){i=0;S=armar()}if(i<0)i=S.length-1;play()}
document.addEventListener('keydown',e=>{

 else if(e.key==='ArrowLeft'){paused=false;flags();go(-1)}

 else if(e.key==='ArrowUp'){mute=!mute;flags();if(mute)speechSynthesis?.cancel()}});
