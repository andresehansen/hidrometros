name: Scraper Altura Río La Plata

on:
  workflow_dispatch:
  schedule:
    - cron: '19 * * * *'

jobs:
  ejecutar-scraper:
    runs-on: ubuntu-latest
    
    # AGREGADO: Permisos necesarios para que el bot pueda modificar archivos en el repositorio
    permissions:
      contents: write 

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar script de Node.js
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          # AGREGADO: Pasamos el token para que index.js pueda escribir el data.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node index.js
